<title id="t">HYDRA-UMC-NODE-HEALING architecture</title>
<desc id="d">HYDRA-UMC-NODE-HEALING reads a node registry, probes each node over HTTP or gRPC with retry and backoff, keeps a journal of state changes and reports an unreachable node to the orchestrator.</desc>
